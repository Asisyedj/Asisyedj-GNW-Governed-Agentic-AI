# GNW P3E — Fail-Closed CI/CD Pipeline
#
# Job chain (enforced with `needs:` — later jobs never run if an earlier one fails):
#   static-checks -> unit-tests -> security-scans -> evidence-verification
#
# Every gate is fail-closed: any non-zero exit, missing artifact, or evidence
# validation failure stops the pipeline. Evidence artifacts (JUnit XML) are
# uploaded even when tests fail, so the audit trail survives failures.

name: GNW CI/CD Fail-Closed

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Static checks: syntax-compile every personal_agent/*.py
  # ---------------------------------------------------------------------------
  static-checks:
    name: Job 1 - Static Checks (py_compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r personal_agent/requirements.txt
          pip install pytest pytest-cov

      - name: py_compile all personal_agent/*.py
        # compileall walks the tree recursively and exits non-zero if any
        # file fails to compile (cross-platform equivalent of
        # `py_compile` over every *.py — no bash-only globbing required).
        run: python -m compileall -f -q personal_agent/

  # ---------------------------------------------------------------------------
  # Job 2 — Unit tests with JUnit evidence artifact
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Job 2 - Unit Tests
    needs: static-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r personal_agent/requirements.txt
          pip install pytest pytest-cov

      - name: Create evidence directory
        run: python -c "import os; os.makedirs('evidence', exist_ok=True)"

      - name: Run unit tests
        run: python -m pytest personal_agent/tests/ -v --junitxml=evidence/unit_tests.xml

      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-unit-tests
          path: evidence/unit_tests.xml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 3 — Security-relevant test scans (approval/mission/state/idempotency/router)
  # ---------------------------------------------------------------------------
  security-scans:
    name: Job 3 - Security Scans
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r personal_agent/requirements.txt
          pip install pytest pytest-cov

      - name: Create evidence directory
        run: python -c "import os; os.makedirs('evidence', exist_ok=True)"

      - name: Run security-focused tests
        run: python -m pytest personal_agent/tests/ -k "approval or mission or state or idempotency or model_router" --junitxml=evidence/security_tests.xml

      - name: Upload security scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-security-scans
          path: evidence/security_tests.xml
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 4 — Evidence verification gate (fail-closed)
  # ---------------------------------------------------------------------------
  evidence-verification:
    name: Job 4 - Evidence Verification (Fail-Closed Gate)
    needs: [static-checks, unit-tests, security-scans]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download unit test evidence
        uses: actions/download-artifact@v4
        with:
          name: evidence-unit-tests
          path: evidence

      - name: Download security scan evidence
        uses: actions/download-artifact@v4
        with:
          name: evidence-security-scans
          path: evidence

      - name: List downloaded evidence
        run: python -c "import os; [print(os.path.join(r, f)) for r, _, fs in os.walk('evidence') for f in fs]"

      - name: Verify evidence completeness (fail-closed)
        # Exits non-zero if any evidence file is missing, has 0 tests,
        # or contains failures/errors.
        run: python scripts/verify_evidence.py --min-tests 1
