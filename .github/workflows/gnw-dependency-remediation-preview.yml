name: GNW Dependency Remediation Preview

on:
  push:
    branches:
      - "integration/**"
    paths:
      - "gnw/package.json"
      - "gnw/package-lock.json"
      - ".github/workflows/gnw-dependency-remediation-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gnw-dependency-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remediate:
    name: Preview semver-safe lockfile remediation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact commit (pinned SHA)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node 22 (pinned SHA)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - name: Capture baseline dependency identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-remediation-evidence
          sha256sum gnw/package.json gnw/package-lock.json | tee dependency-remediation-evidence/before.sha256
          cp gnw/package.json dependency-remediation-evidence/package.json.before

      - name: Install source lockfile
        working-directory: gnw
        run: npm ci

      - name: Apply npm's non-forced semver-compatible lockfile fixes
        working-directory: gnw
        shell: bash
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts
          cmp package.json ../dependency-remediation-evidence/package.json.before || {
            echo "FAIL: remediation unexpectedly changed package.json" >&2
            exit 2
          }

      - name: Reinstall from remediated lockfile
        working-directory: gnw
        run: npm ci

      - name: Verify dependency audit
        working-directory: gnw
        run: npm audit --audit-level=high

      - name: Verify application typecheck, tests and build
        working-directory: gnw
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          npx vitest run tests/phase3-security-boundaries.test.ts tests/executor-auth.test.ts tests/phase4-effect-fence.test.ts tests/phase4-provider-contract.test.ts tests/skills-engine.test.ts tests/governed-execution.test.ts
          node scripts/security-sink-scan.mjs
          npm run verify:sinks
          npm run build
          npm run test:council-python
          python3 ../openclaw_portable/run_order_smoke_tests.py

      - name: Record remediated lockfile digest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sha256sum gnw/package.json gnw/package-lock.json | tee dependency-remediation-evidence/after.sha256
          git diff --stat -- gnw/package.json gnw/package-lock.json | tee dependency-remediation-evidence/lockfile-diff-stat.txt
          cp gnw/package-lock.json dependency-remediation-evidence/package-lock.json
          sha256sum dependency-remediation-evidence/package-lock.json | tee dependency-remediation-evidence/artifact.sha256

      - name: Upload reviewed lockfile candidate and digests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gnw-lockfile-remediation-${{ github.run_id }}
          path: dependency-remediation-evidence/
          if-no-files-found: error
          retention-days: 7
