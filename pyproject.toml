[project]
name = "perplexity-browser-api"
version = "0.1.0"
description = "GNW Governed Agent - Perplexity Browser API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "perplexity-webui-scraper[all]>=1.2.1",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.29,<1",
    "psycopg[pool]>=3.1.18",
    "psycopg-pool>=3.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["personal_agent/tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[project.scripts]
perplexity-browser-api = "perplexity_browser_api:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
